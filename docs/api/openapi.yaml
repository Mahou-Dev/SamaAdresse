openapi: 3.0.1
info:
  title: SamaAdresse API
  description: "API REST de la plateforme citoyenne d'adressage numérique par géolocalisation\
    \ GPS et QR Code (Ziguinchor, Dakar, Saint-Louis)."
  contact:
    name: Projet SamaAdresse
    email: contact@samaadresse.sn
  version: 1.0.0
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Authentification
  description: "Endpoints d'inscription, connexion, rafraîchissement JWT et profil"
- name: Itinéraire Public
  description: Calcul d'itinéraire GPS vers une adresse via OpenRouteService (proxy
    sécurisé)
- name: Partage d'adresse
  description: Envoi du lien de la fiche adresse par SMS
- name: Annuaire Public
  description: Consultation et recherche publique des adresses et établissements répertoriés
- name: Adresses Géolocalisées
  description: "Endpoints de création, résolution publique et consultation d'adresses\
    \ géolocalisées"
- name: Photos
  description: Service de restitution des photos de façade avec cache HTTP immuable
    et ETag
- name: Santé
  description: Contrôle de disponibilité léger (sans accès à la base de données)
- name: Réservations de codes d'adresse
  description: Endpoints de pré-réservation de codes pour la capture hors ligne
- name: Administration & Modération
  description: Endpoints réservés aux administrateurs (ROLE_ADMIN)
- name: Signalements Publics
  description: Signalement anonyme de problèmes sur une adresse publique
paths:
  /api/public/addresses/{code}/reports:
    post:
      tags:
      - Signalements Publics
      summary: Signaler un problème sur une adresse publique (anonyme)
      description: Limité à 3 signalements/heure/IP et 1 signalement par adresse par
        IP par 24 h (clé = hash SHA-256 en mémoire). Renvoie 202 Accepted.
      operationId: reportAddress
      parameters:
      - name: code
        in: path
        description: Code court de l'adresse signalée
        required: true
        schema:
          type: string
        example: ZIG-KBG-4271
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
        required: true
      responses:
        "202":
          description: Signalement enregistré pour modération
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReportCreatedResponse"
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                status: OPEN
                message: Signalement pris en compte.
        "400":
          description: Motif invalide ou commentaire trop long
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse introuvable ou inactive
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Limite de signalements atteinte (doublon 24h ou > 3/h/IP)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/register:
    post:
      tags:
      - Authentification
      summary: Inscription d'un nouvel utilisateur (Rôle PROPRIETAIRE par défaut)
      description: Crée un compte utilisateur avec hachage BCrypt (coût 12).
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Compte créé avec succès
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: Données invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Adresse email déjà utilisée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      tags:
      - Authentification
      summary: Rafraîchissement silencieux de l'Access Token via Cookie Refresh Token
      description: Échange le cookie HttpOnly refreshToken contre un nouveau couple
        Access Token + Refresh Token (rotation).
      operationId: refreshToken
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Nouveau token généré avec succès
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: "Refresh Token absent, invalide ou expiré"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags:
      - Authentification
      summary: Déconnexion utilisateur
      description: Révoque le Refresh Token en base et efface le cookie HttpOnly
      operationId: logout
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Déconnexion effectuée
          content:
            '*/*':
              example:
                message: Déconnexion réussie
  /api/auth/login:
    post:
      tags:
      - Authentification
      summary: Connexion utilisateur
      description: Retourne l'Access Token dans le corps et pose un Refresh Token
        en Cookie HTTP-Only (SameSite=Strict). Limité à 5 essais/min/IP.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Connexion réussie
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9...
                tokenType: Bearer
                expiresIn: 900
        "400":
          description: Format de requête invalide
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Identifiants invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Compte désactivé
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Trop de tentatives (Rate Limit 5/min/IP)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/reset-rate-limits:
    post:
      tags:
      - Administration & Modération
      summary: Réinitialiser les limiteurs de débit
      description: Vide le cache des limiteurs de débit en mémoire (profils dev et
        e2e uniquement).
      operationId: resetRateLimits
      responses:
        "200":
          description: Limiteurs de débit réinitialisés
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès réservé aux administrateurs
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/admin/addresses/{id}/suspend:
    post:
      tags:
      - Administration & Modération
      summary: Suspendre une adresse (motif obligatoire)
      description: Passe l'adresse en SUSPENDED (410 Gone en public) et écrit une
        entrée dans admin_actions.
      operationId: suspendAddress
      parameters:
      - name: id
        in: path
        description: Identifiant UUID de l'adresse
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendAddressRequest"
        required: true
      responses:
        "200":
          description: Adresse suspendue
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Motif manquant ou invalide
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès réservé aux administrateurs
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/admin/addresses/{id}/reinstate:
    post:
      tags:
      - Administration & Modération
      summary: Réactiver une adresse suspendue
      description: Repasse l'adresse en ACTIVE et écrit une entrée dans admin_actions.
      operationId: reinstateAddress
      parameters:
      - name: id
        in: path
        description: Identifiant UUID de l'adresse
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: Adresse réactivée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Opération invalide sur le statut actuel
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès réservé aux administrateurs
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/addresses:
    post:
      tags:
      - Adresses Géolocalisées
      summary: Créer une nouvelle adresse géolocalisée (JSON)
      description: "Résout automatiquement la zone et le quartier à partir des coordonné\
        es GPS, puis génère un code court immuable (ex: ZIG-KBG-4271). Supporte l'idempotence\
        \ via clientRequestId et la consommation d'un reservedCode."
      operationId: createAddressMultipart
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: "#/components/schemas/CreateAddressRequest"
                photo:
                  type: string
                  description: "Fichier image optionnel (JPEG/PNG/WebP, max 5 Mo)"
                  format: binary
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
        required: true
      responses:
        "201":
          description: Adresse créée avec succès
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "200":
          description: Rejeu idempotent d'une requête déjà traitée (clientRequestId
            existant)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Coordonnées invalides ou données de formulaire incorrectes
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Coordonnées hors zone couverte par la grille géographique
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/addresses/{id}/restore:
    post:
      tags:
      - Adresses Géolocalisées
      summary: Restaurer une adresse archivée (propriétaire uniquement)
      description: Réactive une adresse ARCHIVED vers ACTIVE. Interdit (400) si l'adresse
        est SUSPENDED.
      operationId: restoreAddress
      parameters:
      - name: id
        in: path
        description: Identifiant UUID de l'adresse
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Adresse restaurée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Restauration interdite (adresse non archivée ou suspendue)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès refusé - vous n'êtes pas le propriétaire
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/addresses/{id}/photo:
    post:
      tags:
      - Adresses Géolocalisées
      summary: Uploader une photo de façade pour une adresse existante
      description: "Associe une photo de façade à une adresse existante (propriétaire\
        \ ou ADMIN). Validations : JPEG/PNG/WebP par magic bytes, max 5 Mo."
      operationId: uploadAddressPhoto
      parameters:
      - name: id
        in: path
        description: Identifiant UUID de l'adresse
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  description: Fichier image (JPEG/PNG/WebP)
                  format: binary
      responses:
        "200":
          description: Photo uploadée et adresse mise à jour
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Fichier invalide ou non image (magic bytes) ou taille > 5 Mo
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès refusé - vous n'êtes pas le propriétaire de cette adresse
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse non trouvée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Adresses Géolocalisées
      summary: Supprimer la photo de façade d'une adresse (propriétaire uniquement)
      description: Retire la photo de l'adresse et la supprime du stockage (disque
        ou base de données).
      operationId: deleteAddressPhoto
      parameters:
      - name: id
        in: path
        description: Identifiant UUID de l'adresse
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Photo supprimée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès refusé - vous n'êtes pas le propriétaire
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/addresses/{id}/archive:
    post:
      tags:
      - Adresses Géolocalisées
      summary: Archiver une adresse (propriétaire uniquement)
      description: Passe le statut de l'adresse à ARCHIVED. La fiche publique et le
        QR code renvoient alors 410 Gone.
      operationId: archiveAddress
      parameters:
      - name: id
        in: path
        description: Identifiant UUID de l'adresse
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Adresse archivée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Opération invalide sur le statut actuel
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès refusé - vous n'êtes pas le propriétaire
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/addresses/{code}/share/sms:
    post:
      tags:
      - Partage d'adresse
      summary: Envoyer le lien d'une adresse par SMS
      description: |-
        Envoie au destinataire un SMS (GSM-7, < 160 caractères, sans donnée personnelle) :
        `SamaAdresse : adresse ZIG-KBG-4271. Voir la fiche et l'itinéraire : {FRONTEND_BASE_URL}/a/ZIG-KBG-4271`.

        Réservé aux utilisateurs connectés (chaque SMS est payant). Limites anti-fraude :
        5 SMS / heure / utilisateur, 3 SMS / 24 h / numéro destinataire, plafond global quotidien (SMS_DAILY_CAP).
        Le numéro destinataire n'est jamais enregistré.
      operationId: shareBySms
      parameters:
      - name: code
        in: path
        description: Code d'adresse
        required: true
        schema:
          type: string
        example: ZIG-KBG-4271
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareSmsRequest"
        required: true
      responses:
        "200":
          description: SMS accepté par le fournisseur
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShareSmsResponse"
              example:
                status: SENT
                maskedPhone: +221 77 *** ** 03
        "400":
          description: "Numéro absent, mal formé ou non sénégalais"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: 2026-10-14T18:00:00Z
                status: 400
                error: Bad Request
                message: Erreur de validation des champs
                path: /api/addresses/ZIG-KBG-4271/share/sms
                fieldErrors:
                  phoneNumber: "Le numéro doit être un mobile sénégalais (ex: +221771234567)"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: 2026-10-14T18:00:00Z
                status: 401
                error: Unauthorized
                message: Authentification requise
                path: /api/addresses/ZIG-KBG-4271/share/sms
        "404":
          description: Adresse inexistante ou non active
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: 2026-10-14T18:00:00Z
                status: 404
                error: Not Found
                message: "Adresse non trouvée ou inactive : ZIG-KBG-0000"
                path: /api/addresses/ZIG-KBG-0000/share/sms
        "429":
          description: "Limite d'envoi atteinte (utilisateur, destinataire ou plafond\
            \ global)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: 2026-10-14T18:00:00Z
                status: 429
                error: Too Many Requests
                message: "Limite atteinte : vous pouvez envoyer 5 SMS par heure. Ré\
                  essayez plus tard ou partagez via WhatsApp."
                path: /api/addresses/ZIG-KBG-4271/share/sms
        "502":
          description: Fournisseur SMS en échec ou sans réponse sous 5 s
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                timestamp: 2026-10-14T18:00:00Z
                status: 502
                error: Bad Gateway
                message: Le service SMS est momentanément indisponible. Veuillez réessayer
                  plus tard.
                path: /api/addresses/ZIG-KBG-4271/share/sms
      security:
      - bearerAuth: []
  /api/address-codes/reservations:
    get:
      tags:
      - Réservations de codes d'adresse
      summary: Obtenir les réservations actives de l'utilisateur
      description: Renvoie la liste de tous les codes réservés actifs et non expirés
        de l'utilisateur connecté.
      operationId: getActiveReservations
      responses:
        "200":
          description: Liste des réservations actives
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservedCodeResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Réservations de codes d'adresse
      summary: Compléter le stock de codes réservés pour une zone
      description: "Complète à 3 codes actifs par quartier pour la zone demandée (ZIG\
        \ ou DKR), dans la limite de 40 réservations actives par utilisateur. Limité\
        \ à 5 appels par heure."
      operationId: topUpReservations
      parameters:
      - name: zone
        in: query
        description: Code de zone (ZIG ou DKR)
        required: true
        schema:
          type: string
        example: ZIG
      responses:
        "200":
          description: Stock de réservations actives mis à jour
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservedCodeResponse"
        "400":
          description: Paramètre zone invalide
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Limite de débit horaire atteinte (5 appels/h)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/admin/reports/{id}:
    patch:
      tags:
      - Administration & Modération
      summary: Mettre à jour le statut d'un signalement (RESOLVED ou DISMISSED)
      description: Met à jour le signalement et écrit une entrée dans admin_actions.
      operationId: updateReportStatus
      parameters:
      - name: id
        in: path
        description: Identifiant UUID du signalement
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusRequest"
        required: true
      responses:
        "200":
          description: Signalement mis à jour
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminReportResponse"
        "400":
          description: Statut invalide
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès réservé aux administrateurs
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Signalement introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/addresses/{id}:
    patch:
      tags:
      - Adresses Géolocalisées
      summary: Mettre à jour la description ou le type d'une adresse (propriétaire
        uniquement)
      description: Le code et la position sont immuables (400 si fournis ou si l'adresse
        est archivée/suspendue).
      operationId: updateAddress
      parameters:
      - name: id
        in: path
        description: Identifiant UUID de l'adresse
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddressRequest"
        required: true
      responses:
        "200":
          description: Adresse mise à jour
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Modification interdite (code/position immuables ou adresse
            inactive)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès refusé - vous n'êtes pas le propriétaire
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse introuvable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/addresses/{id}/visibility:
    patch:
      tags:
      - Adresses Géolocalisées
      summary: Modifier la visibilité d'une adresse dans l'annuaire (propriétaire
        uniquement)
      description: Réservé au propriétaire de l'adresse (403 sinon). Met à jour les
        options de publication dans l'annuaire.
      operationId: updateVisibility
      parameters:
      - name: id
        in: path
        description: Identifiant UUID de l'adresse
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVisibilityRequest"
        required: true
      responses:
        "200":
          description: Visibilité mise à jour avec succès
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          description: Adresse inactive
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès refusé - vous n'êtes pas le propriétaire
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse non trouvée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /uploads/{filename}:
    get:
      tags:
      - Photos
      summary: Récupérer une photo de façade
      description: "Sert l'image stockée sur disque (dev) ou en base PostgreSQL bytea\
        \ (prod) avec Cache-Control: public, max-age=31536000, immutable et ETag."
      operationId: servePhoto
      parameters:
      - name: filename
        in: path
        description: "Nom du fichier photo (ex: 00000000-0000-4000-8000-000000000001.jpg)"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Photo trouvée et retournée
          content:
            '*/*':
              schema:
                type: string
                format: byte
        "304":
          description: Photo non modifiée (ETag valide)
          content:
            '*/*':
              schema:
                type: string
                format: byte
        "404":
          description: Photo introuvable
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /uploads/:
    get:
      tags:
      - Photos
      summary: Accès au répertoire des téléversements (interdit/introuvable)
      description: Empêche le listage du répertoire /uploads/ et renvoie 404 Not Found.
      operationId: uploadsDirectory
      responses:
        "404":
          description: Répertoire introuvable ou listage interdit
  /uploads:
    get:
      tags:
      - Photos
      summary: Accès au répertoire des téléversements (interdit/introuvable)
      description: Empêche le listage du répertoire /uploads/ et renvoie 404 Not Found.
      operationId: uploadsDirectory_1
      responses:
        "404":
          description: Répertoire introuvable ou listage interdit
  /api/public/route:
    get:
      tags:
      - Itinéraire Public
      summary: Calculer un itinéraire vers une adresse géolocalisée
      description: Proxy vers OpenRouteService. Destination résolue depuis le code.
        Coordonnées de départ strictement au Sénégal. Limité à 20 requêtes par minute
        par IP. Aucune coordonnée journalisée.
      operationId: getRoute
      parameters:
      - name: fromLat
        in: query
        description: Latitude GPS du point de départ (au Sénégal)
        required: true
        schema:
          type: number
          format: double
        example: 12.5638
      - name: fromLon
        in: query
        description: Longitude GPS du point de départ (au Sénégal)
        required: true
        schema:
          type: number
          format: double
        example: -16.2735
      - name: code
        in: query
        description: Code court de l'adresse de destination
        required: true
        schema:
          type: string
        example: ZIG-KBG-4271
      - name: profile
        in: query
        description: "Profil de déplacement (driving-car ou foot-walking, défaut driving-car)"
        required: false
        schema:
          type: string
          default: driving-car
        example: driving-car
      responses:
        "200":
          description: Itinéraire calculé avec succès
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "400":
          description: Coordonnées de départ invalides ou hors Sénégal
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adresse de destination introuvable ou inactive
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Aucun itinéraire routier trouvé pour cette destination
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Limite de débit dépassée (20 req/min/IP)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service d'itinéraire temporairement indisponible
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/public/directory:
    get:
      tags:
      - Annuaire Public
      summary: Consulter et rechercher dans l'annuaire public
      description: "Recherche par texte libre (description, quartier, nom si autorisé\
        ) ou par code, avec filtrage par quartier et type de lieu. Limité à 30 requê\
        tes par minute par IP."
      operationId: searchDirectory
      parameters:
      - name: q
        in: query
        description: "Terme de recherche (code ou mots-clés, min 2 caractères sauf\
          \ si un filtre est actif)"
        required: false
        schema:
          type: string
      - name: quartier
        in: query
        description: "Code ou nom de quartier (ex: KBG, BOUCOTTE)"
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: "Type de lieu (MAISON, COMMERCE, INSTITUTION)"
        required: false
        schema:
          type: string
          enum:
          - MAISON
          - COMMERCE
          - INSTITUTION
      - name: page
        in: query
        description: "Index de page (base 0, défaut 0)"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: "Taille de page (défaut 12, max 50)"
        required: false
        schema:
          type: integer
          format: int32
          default: 12
      responses:
        "200":
          description: Page de résultats de l'annuaire
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageDirectoryItemResponse"
        "400":
          description: Terme de recherche invalide (< 2 caractères sans filtre)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Limite de débit dépassée (30 req/min/IP)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/health:
    get:
      tags:
      - Santé
      summary: Vérifier la disponibilité du service
      description: "Renvoie {\"status\":\"UP\"} immédiatement sans interroger PostgreSQL,\
        \ afin que le contrôle de santé de Render ne réveille pas l'instance Neon\
        \ au repos."
      operationId: healthCheck
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              example:
                status: UP
  /api/auth/me:
    get:
      tags:
      - Authentification
      summary: Profil de l'utilisateur connecté
      description: Route protégée nécessitant l'en-tête Authorization Bearer
      operationId: me
      responses:
        "200":
          description: Profil récupéré
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/admin/reports:
    get:
      tags:
      - Administration & Modération
      summary: Lister les signalements d'adresses (paginé)
      description: "Filtrable par statut OPEN, RESOLVED ou DISMISSED."
      operationId: getReports
      parameters:
      - name: status
        in: query
        description: "Statut du signalement (OPEN, RESOLVED, DISMISSED)"
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - RESOLVED
          - DISMISSED
      - name: page
        in: query
        description: Index de page (base 0)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Taille de page
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Page de signalements retournée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageAdminReportResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Accès réservé aux administrateurs
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/addresses/{code}:
    get:
      tags:
      - Adresses Géolocalisées
      summary: Résoudre une adresse publique par son code court
      description: Endpoint public sans authentification. Renvoie la fiche adresse
        si elle existe et est active (410 Gone si archivée ou suspendue).
      operationId: getPublicAddressByCode
      parameters:
      - name: code
        in: path
        description: Code court de l'adresse
        required: true
        schema:
          type: string
        example: ZIG-KBG-4271
      responses:
        "200":
          description: Adresse trouvée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicAddressResponse"
        "404":
          description: Adresse non trouvée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Adresse archivée ou suspendue
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Limite de requêtes dépassée (60 req/min/IP)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/addresses/{code}/qrcode:
    get:
      tags:
      - Adresses Géolocalisées
      summary: Générer le QR code d'une adresse publique
      description: Génère à la volée une image PNG du QR Code (300x300 px) encodant
        l'URL publique complète de la fiche adresse.
      operationId: getAddressQrCode
      parameters:
      - name: code
        in: path
        description: Code court de l'adresse
        required: true
        schema:
          type: string
        example: ZIG-KBG-4271
      responses:
        "200":
          description: Image PNG du QR code générée
          content:
            image/png: {}
        "404":
          description: Adresse non trouvée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Adresse archivée ou suspendue
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/addresses/mine:
    get:
      tags:
      - Adresses Géolocalisées
      summary: Lister les adresses du propriétaire connecté
      description: Renvoie toutes les adresses créées par l'utilisateur connecté.
      operationId: getMyAddresses
      responses:
        "200":
          description: Liste d'adresses de l'utilisateur
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "401":
          description: Non authentifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    CreateReportRequest:
      required:
      - reason
      type: object
      properties:
        reason:
          type: string
          description: Motif du signalement
          example: POSITION_INCORRECTE
          enum:
          - POSITION_INCORRECTE
          - CONTENU_INAPPROPRIE
          - PHOTO_INAPPROPRIEE
          - AUTRE
        comment:
          maxLength: 300
          minLength: 0
          type: string
          description: Commentaire optionnel (max 300 caractères)
      description: Requête de signalement anonyme d'une adresse publique
    ReportCreatedResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    RegisterRequest:
      required:
      - email
      - fullName
      - password
      - phoneNumber
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        phoneNumber:
          pattern: "^\\+221(70|75|76|77|78|33)[0-9]{7}$"
          type: string
        password:
          pattern: "^(?=.*[0-9])(?=.*[A-Z]).{8,}$"
          type: string
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - PROPRIETAIRE
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
      description: Propriétaire de l'adresse
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/UserProfileResponse"
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    SuspendAddressRequest:
      required:
      - reason
      type: object
      properties:
        reason:
          maxLength: 500
          minLength: 0
          type: string
    AddressResponse:
      type: object
      properties:
        id:
          type: string
          description: ID unique de l'adresse
          format: uuid
        code:
          type: string
          description: Code court d'adresse géolocalisée
          example: ZIG-KBG-4271
        latitude:
          type: number
          description: Latitude GPS
          format: double
          example: 12.5738
        longitude:
          type: number
          description: Longitude GPS
          format: double
          example: -16.265
        zone:
          type: string
          description: Code de la zone géographique
          example: ZIG
        quartier:
          type: string
          description: Code du quartier résolu
          example: KBG
        description:
          type: string
          description: Description / repère visuel
          example: "Maison familiale au toit rouge, 3e concession après la mosquée"
        photoUrl:
          type: string
          description: URL de la photo (si présente)
          example: "null"
        locationType:
          type: string
          description: Type de lieu
          example: MAISON
          enum:
          - MAISON
          - COMMERCE
          - INSTITUTION
        status:
          type: string
          description: Statut de modération
          example: ACTIVE
          enum:
          - ACTIVE
          - ARCHIVED
          - SUSPENDED
          - SIGNALED
        listed:
          type: boolean
          description: Indique si l'adresse figure dans l'annuaire public
          example: true
        showOwnerName:
          type: boolean
          description: Indique si le nom du propriétaire est affiché publiquement
          example: false
        moderationNotice:
          type: string
          description: Mention de modération affichée au propriétaire si l'adresse
            est suspendue
          example: Suspendue par la modération
        createdAt:
          type: string
          description: Date de création
          format: date-time
        owner:
          $ref: "#/components/schemas/UserProfileResponse"
        codeChanged:
          type: boolean
          description: Indique si le code réservé fourni a dû être remplacé par un
            nouveau code
          example: false
        previousCode:
          type: string
          description: Ancien code réservé si le code a été remplacé
          example: ZIG-KBG-1234
        clientRequestId:
          type: string
          description: Identifiant de requête client idempotent
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      description: Représentation complète d'une adresse géolocalisée
    CreateAddressRequest:
      required:
      - description
      - latitude
      - locationType
      - longitude
      type: object
      properties:
        latitude:
          maximum: 90
          minimum: -90
          type: number
          description: "Latitude GPS (ex: 12.5738 pour Boucotte Ziguinchor)"
          format: double
          example: 12.5738
        longitude:
          maximum: 180
          minimum: -180
          type: number
          description: "Longitude GPS (ex: -16.2650 pour Boucotte Ziguinchor)"
          format: double
          example: -16.265
        description:
          maxLength: 500
          minLength: 0
          type: string
          description: Repère visuel ou description humaine de la concession
          example: "Maison familiale au toit rouge, 3e concession à gauche après la\
            \ Grande Mosquée"
        locationType:
          type: string
          description: Type de lieu
          example: MAISON
          enum:
          - MAISON
          - COMMERCE
          - INSTITUTION
        listed:
          type: boolean
          description: Indique si l'adresse figure dans l'annuaire public
          example: true
        showOwnerName:
          type: boolean
          description: Indique si le nom du propriétaire est affiché publiquement
          example: false
        reservedCode:
          type: string
          description: Code réservé hors ligne optionnel
          example: ZIG-KBG-1234
        clientRequestId:
          type: string
          description: Identifiant idempotent unique côté client pour déduplication
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      description: Requête de création d'adresse géolocalisée
    ShareSmsRequest:
      required:
      - phoneNumber
      type: object
      properties:
        phoneNumber:
          pattern: "^\\+221(70|75|76|77|78)[0-9]{7}$"
          type: string
          description: Numéro mobile sénégalais au format E.164
          example: "+221771234503"
      description: Demande d'envoi par SMS du lien de la fiche adresse
    ShareSmsResponse:
      type: object
      properties:
        status:
          type: string
          example: SENT
        maskedPhone:
          type: string
          example: +221 77 *** ** 03
      description: Résultat de l'envoi du SMS de partage
    ReservedCodeResponse:
      type: object
      properties:
        id:
          type: string
          description: Identifiant unique de la réservation
          format: uuid
        code:
          type: string
          description: Code réservé au format ZONE-QUARTIER-XXXX
          example: ZIG-KBG-1234
        zone:
          type: string
          description: Zone géographique
          example: ZIG
        quartier:
          type: string
          description: Quartier géographique
          example: KBG
        status:
          type: string
          description: Statut de la réservation
          example: RESERVED
          enum:
          - RESERVED
          - USED
          - EXPIRED
        createdAt:
          type: string
          description: Date et heure de création de la réservation
          format: date-time
        expiresAt:
          type: string
          description: Date et heure d'expiration (30 jours)
          format: date-time
      description: Réponse représentant un code d'adresse réservé pour création hors
        ligne
    UpdateReportStatusRequest:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          enum:
          - OPEN
          - RESOLVED
          - DISMISSED
        reason:
          maxLength: 500
          minLength: 0
          type: string
    AdminReportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          enum:
          - POSITION_INCORRECTE
          - CONTENU_INAPPROPRIE
          - PHOTO_INAPPROPRIEE
          - AUTRE
        comment:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - RESOLVED
          - DISMISSED
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
        addressId:
          type: string
          format: uuid
        addressCode:
          type: string
        addressZone:
          type: string
        addressQuartier:
          type: string
        addressLocationType:
          type: string
          enum:
          - MAISON
          - COMMERCE
          - INSTITUTION
        addressDescription:
          type: string
        addressPhotoUrl:
          type: string
        addressStatus:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - SUSPENDED
          - SIGNALED
    UpdateAddressRequest:
      type: object
      properties:
        description:
          maxLength: 500
          minLength: 0
          type: string
          description: Nouvelle description / repère visuel (max 500 caractères)
        locationType:
          type: string
          description: "Nouveau type de lieu (MAISON, COMMERCE, INSTITUTION)"
          enum:
          - MAISON
          - COMMERCE
          - INSTITUTION
        listed:
          type: boolean
          description: Indique si l'adresse figure dans l'annuaire public
          example: true
        showOwnerName:
          type: boolean
          description: Indique si le nom du propriétaire est affiché publiquement
          example: false
      description: Requête de mise à jour partielle d'une adresse (description et
        type de lieu uniquement ; code et position immuables)
    UpdateVisibilityRequest:
      type: object
      properties:
        listed:
          type: boolean
          description: Indique si l'adresse doit figurer dans l'annuaire public
          example: true
        showOwnerName:
          type: boolean
          description: Indique si le nom du propriétaire doit être affiché publiquement
          example: false
      description: Demande de modification de la visibilité d'une adresse dans l'annuaire
    GeoJsonLineString:
      type: object
      properties:
        type:
          type: string
          description: Type GeoJSON
          example: LineString
        coordinates:
          type: array
          description: "Liste ordonnée de coordonnées [longitude, latitude]"
          items:
            type: array
            description: "Liste ordonnée de coordonnées [longitude, latitude]"
            items:
              type: number
              description: "Liste ordonnée de coordonnées [longitude, latitude]"
              format: double
      description: Géométrie GeoJSON LineString pour le tracé cartographique
    RouteResponse:
      type: object
      properties:
        distance:
          type: number
          description: Distance totale en mètres
          format: double
          example: 3420.5
        duration:
          type: number
          description: Durée estimée en secondes
          format: double
          example: 720.0
        geometry:
          $ref: "#/components/schemas/GeoJsonLineString"
        steps:
          type: array
          description: Étapes textuelles de l'itinéraire (max 15)
          items:
            $ref: "#/components/schemas/RouteStep"
      description: Réponse d'itinéraire calculé depuis la position de l'utilisateur
    RouteStep:
      type: object
      properties:
        instruction:
          type: string
          description: Instruction de navigation
          example: Prendre à droite sur Rue du Commerce
        distance:
          type: number
          description: Distance du tronçon en mètres
          format: double
          example: 250.0
        duration:
          type: number
          description: Durée estimée du tronçon en secondes
          format: double
          example: 45.0
      description: Étape textuelle d'un itinéraire
    DirectoryItemResponse:
      type: object
      properties:
