spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: samaadresse-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/manifest+json,image/svg+xml
    min-response-size: 1024

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
  security:
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:0}
    login-rate-limit: ${LOGIN_RATE_LIMIT:5}

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

storage:
  type: ${PHOTO_STORAGE:disk}

demo:
  seed: ${DEMO_SEED:false}
  password: ${DEMO_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/samaadresse}
    username: ${DB_USERNAME:samaadresse}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

frontend:
  base:
    url: ${FRONTEND_BASE_URL:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-ms: ${JWT_ACCESS_EXP:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}

sms:
  provider: ${SMS_PROVIDER:mock}
  timeout: ${SMS_TIMEOUT:5s}
  daily-cap: ${SMS_DAILY_CAP:200}
  user-hourly-limit: ${SMS_USER_HOURLY_LIMIT:5}
  recipient-daily-limit: ${SMS_RECIPIENT_DAILY_LIMIT:3}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    api-base-url: ${TWILIO_API_BASE_URL:https://api.twilio.com}
  sendflash:
    api-url: ${SENDFLASH_API_URL:https://api.sendflash.com/v1/sms/send}
    api-key: ${SENDFLASH_API_KEY:}
    sender-id: ${SENDFLASH_SENDER_ID:SamaAdresse}

upload:
  dir: ${UPLOAD_DIR:./uploads}

geo:
  fallback-max-distance-km: ${GEO_FALLBACK_MAX_DISTANCE_KM:3.0}

ors:
  api-key: ${ORS_API_KEY:}
  base-url: ${ORS_BASE_URL:https://api.openrouteservice.org}

logging:
  level:
    sn.samaadresse: DEBUG

---
spring:
  config:
    activate:
      on-profile: e2e
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/samaadresse_e2e}
    username: ${DB_USERNAME:samaadresse}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

frontend:
  base:
    url: ${FRONTEND_BASE_URL:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

sms:
  provider: mock

upload:
  dir: ${UPLOAD_DIR:./uploads-e2e}

geo:
  fallback-max-distance-km: 3.0

ors:
  api-key: ${ORS_API_KEY:}
  base-url: ${ORS_BASE_URL:https://api.openrouteservice.org}

logging:
  level:
    sn.samaadresse: INFO
