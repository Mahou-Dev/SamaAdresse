services:
  - type: web
    name: samaadresse
    runtime: docker
    branch: main
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PHOTO_STORAGE
        value: db
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_DAILY_CAP
        value: "20"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: LOGIN_RATE_LIMIT
        value: "5" # relever à 20 le jour de la démonstration
      - key: DEMO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
