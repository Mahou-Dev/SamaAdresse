services:
  - type: web
    name: samaadresse
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PHOTO_STORAGE
        value: db
      - key: SMS_PROVIDER
        value: mock
      - key: SMS_DAILY_CAP
        value: "20"
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: ORS_API_KEY
        sync: false
